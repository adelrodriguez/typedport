name: build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["test"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify package
        run: pnpm run build:verify

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run worker-threads example
        run: pnpm tsx examples/worker-threads/main.ts

      - name: Run capnweb example
        run: pnpm tsx examples/capnweb/main.ts

      - name: Run Hono example
        run: |
          pnpm tsx examples/hono/server.ts &
          sleep 2
          pnpm tsx examples/hono/client.ts
          kill %1

      - name: Run WebSocket example
        run: |
          pnpm tsx examples/websocket/server.ts &
          sleep 2
          pnpm tsx examples/websocket/client.ts
          kill %1

      # The dev server opens its port before it seeds the default user, and
      # rejects the dev token with a 400 until then — so wait for an
      # authenticated request to succeed, not just for the port.
      - name: Run QStash example
        run: |
          npx -y @upstash/qstash-cli dev &
          pnpm tsx examples/qstash/server.ts > server.log 2>&1 &
          timeout 60 sh -c 'until curl -sf -H "Authorization: Bearer eyJVc2VySUQiOiJkZWZhdWx0VXNlciIsIlBhc3N3b3JkIjoiZGVmYXVsdFBhc3N3b3JkIn0=" http://127.0.0.1:8080/v2/queues > /dev/null; do sleep 0.5; done'
          timeout 30 sh -c 'until grep -q "listening on" server.log; do sleep 0.5; done'
          pnpm tsx examples/qstash/client.ts
          timeout 30 sh -c 'until grep -q "welcome email sent" server.log && grep -q "report rep_123 ready" server.log; do sleep 0.5; done' || { cat server.log; exit 1; }
          cat server.log
          kill %1 %2
