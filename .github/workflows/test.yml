name: test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["adamantite"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest does not check types, and the implement() suite's compile-time
      # assertions (@ts-expect-error) only fail under tsc — without this step a
      # weakened type keeps CI green while the README's promises go stale.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test
